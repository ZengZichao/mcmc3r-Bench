name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connect-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - name: Restore dependencies
        run: Rscript -e 'renv::restore()'
      - name: Install rsconnect
        run: Rscript -e 'install.packages("rsconnect")'
      - name: Deploy to Posit Connect Cloud
        env:
          CONNECT_CLOUD_CLIENT_ID: ${{ secrets.CONNECT_CLOUD_CLIENT_ID }}
          CONNECT_CLOUD_CLIENT_SECRET: ${{ secrets.CONNECT_CLOUD_CLIENT_SECRET }}
          CONNECT_CLOUD_ACCOUNT: ${{ secrets.CONNECT_CLOUD_ACCOUNT }}
        run: Rscript dev/deploy.R
