name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - uses: r-lib/actions/setup-renv@v2
      - name: Restore dependencies
        run: Rscript -e 'renv::restore()'
      - name: Lint R sources
        run: |
          install.packages("lintr")
          lintr::lint_dir("R")
        shell: Rscript {0}
        continue-on-error: true
      - name: Unit tests
        run: Rscript tests/testthat.R
      - name: Install coverage tool
        run: Rscript -e 'install.packages("covr")'
      - name: Service-layer coverage
        run: Rscript dev/coverage.R
      - name: i18n checks
        run: Rscript dev/i18n_check.R
      - name: Documentation parity
        run: Rscript dev/docs_check.R
      - name: Release consistency
        run: Rscript dev/check_release.R
      - name: Install Chrome
        uses: r-lib/actions/setup-chrome@v1
      - name: End-to-end tests
        run: Rscript tests/shinytest2/run-tests.R
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            tests/**/*.log
            *.Rout
          if-no-files-found: ignore
