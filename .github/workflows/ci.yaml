name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: "4.6.1"
          use-public-rspm: true
      - name: Preinstall mcmc3r dependencies
        # renv installs the GitHub package in parallel; these must already be
        # visible in .libPaths() for R CMD INSTALL to resolve Depends.
        run: Rscript -e 'install.packages(c("ape", "coda", "corpcor"))'
      - uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - name: Lint R sources
        run: |
          install.packages("lintr")
          lintr::lint_dir("R")
        shell: Rscript {0}
        continue-on-error: true
      - name: Unit tests
        run: Rscript tests/testthat.R
      - name: Install coverage tool
        run: Rscript -e 'install.packages("covr")'
      - name: Service-layer coverage
        run: Rscript dev/coverage.R
      - name: i18n checks
        run: Rscript dev/i18n_check.R
      - name: Documentation parity
        run: Rscript dev/docs_check.R
      - name: Release consistency
        run: Rscript dev/check_release.R
      - name: End-to-end tests
        # Google Chrome is preinstalled on ubuntu-latest and discovered by chromote.
        run: Rscript tests/shinytest2/run-tests.R
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs
          path: |
            tests/**/*.log
            *.Rout
          if-no-files-found: ignore
